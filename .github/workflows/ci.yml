name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Una vez generes pnpm-lock.yaml localmente y lo commitees, cambia a
      # `pnpm install --frozen-lockfile` para builds reproducibles.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @manicuba/shared build
      - run: pnpm --filter @manicuba/shared test
      - run: pnpm --filter @manicuba/api prisma:generate
      - run: pnpm typecheck
